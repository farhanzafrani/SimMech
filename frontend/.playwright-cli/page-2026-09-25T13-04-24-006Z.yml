        - heading "Torsion in Circular Shafts" [level=1] [ref=f3e41]
        - generic [ref=f3e42]: Shear stress distribution and angle of twist under torsional loading.
        - paragraph [ref=f3e43]: Twist a shaft and every fiber inside it shears against its neighbor — most at the surface, not at all at the center. That radial pattern is what makes a solid shaft so efficient at carrying torque, and it is also why the angle of twist and the peak stress obey two different, equally important limits when you size a drive shaft.
