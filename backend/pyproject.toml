[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simmec-backend"
version = "0.1.0"
description = "SimMec - Interactive Mechanical Engineering Platform Backend"
requires-python = ">=3.10"
authors = [
    { name = "SimMec Contributors" },
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "simmec-engine",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "httpx==0.25.2",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app.py", "config.py", "routers"]

[tool.uv]
python-version = "3.10"
python-patch = "3.10.13"

[tool.uv.sources]
simmec-engine = { workspace = true }
