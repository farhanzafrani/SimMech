[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simmec-engine"
version = "0.1.0"
description = "SimMec - Interactive Mechanical Engineering Platform - Computation Engine"
requires-python = ">=3.10"
authors = [
    { name = "SimMec Contributors" },
]

dependencies = [
    "numpy>=1.24.3,<2.0",
    "scipy>=1.11.0,<2.0",
]

[project.optional-dependencies]
manim = [
    "manim==0.18.0",
    "matplotlib==3.8.2",
]

dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simmec_engine"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
